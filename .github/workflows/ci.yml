name: ci

on:
  push:
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[benchmark]'
      - run: python -m unittest discover -s tests -v
      - run: spectrashift demo --output /tmp/spectrashift-demo
