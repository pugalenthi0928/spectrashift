experiment:
  name: oxhyper_mini_pca_logistic
  status: runner_validated_awaiting_public_data_run
  seed: 20260822

data:
  repository: previtus/OxHyperMinerals_MINI
  revision: 0b58274
  split_files:
    train: train_minerals_10.csv
    validation: val_minerals_10.csv
    test: test_minerals_10.csv
  source_group_policy: remove_final_tile_suffix
  groups_per_split:
    train: 4
    validation: 2
    test: 2
  tiles_per_group: 2
  label_classes: [goethite, hematite, kaolinite]
  label_provenance: emit_l2b_derived_experimental_pseudo_labels

model:
  family: PCA+LogisticRegression
  pca_components: 32
  class_weight: balanced
  max_train_pixels_per_tile: 20000

evaluation:
  threshold_source: validation_only
  metrics: [macro_f1, average_precision, mean_iou, ece, brier, risk_coverage]
  preserve_prediction_maps: true
  preserve_failure_spectra: true

claims:
  allow_public_result: false
  required_grade_after_review: public-benchmark-observed
